name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist
          retention-days: 1

  browsers:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: chromium-laptop
            browser: chromium
          - project: android-pixel-7
            browser: chromium
          - project: android-small-360
            browser: chromium
          - project: webkit-iphone-se
            browser: webkit
          - project: webkit-iphone-14
            browser: webkit
          - project: webkit-iphone-landscape
            browser: webkit
          - project: webkit-ipad
            browser: webkit
          - project: webkit-desktop
            browser: webkit
          - project: firefox-desktop
            browser: firefox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist
      - name: Install test browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test the production build
        run: npx playwright test --project=${{ matrix.project }} --workers=2
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Keep "verify" as the aggregate status for existing branch protection.
  verify:
    needs: [checks, browsers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require source and browser checks to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: test "$CHECKS" = success && test "$BROWSERS" = success

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/merged
          retention-days: 7
